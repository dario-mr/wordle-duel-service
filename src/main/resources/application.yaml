server:
  port: ${PORT:8088}
  forward-headers-strategy: framework # honor the original external request context (host, scheme, prefix)
  servlet:
    session:
      cookie:
        name: __Host-wd_session
        http-only: true
        secure: true
        same-site: lax
        path: /
        max-age: 180d

spring:
  application.name: wordle-duel-service
  session.timeout: 180d
  profiles.active: ${PROFILE:prod}
  config.import: optional:file:.env[.properties] # enable scanning of .env file
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: wordle
    liquibase-schema: wordle
  jpa:
    properties.hibernate.default_schema: wordle
  data:
    redis.repositories.enabled: false
  security:
    oauth2.client.registration:
      google:
        client-id: ${WORDLE_GOOGLE_CLIENT_ID}
        client-secret: ${WORDLE_GOOGLE_CLIENT_SECRET}
        scope: openid, profile, email
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

management:
  health:
    redis.enabled: false
  endpoints:
    web.exposure.include: health,info,prometheus
  endpoint:
    health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

wordle:
  max-attempts: 6
  word-length: 5

app:
  security:
    whitelist-ant-patterns: /actuator/**,/oauth2/**,/login/**,/public/**,/h2-console/**,/swagger-ui/**,/v3/api-docs/**
    csrf:
      cookie-name: WD-XSRF-TOKEN
      header-name: X-WD-XSRF-TOKEN
    matcher:
      api: /api/**
      admin: /admin/**
      auth: /auth/**
springdoc:
  swagger-ui.csrf.enabled: true

room:
  lock:
    acquire-timeout: PT3S
  cleanup:
    cron: "-"
    retention-days: 60
